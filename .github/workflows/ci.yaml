name: CI Pipeline

on:
  push:
    branches:
      - main
      - devel
      - stage
      - 'feature-*'
      - 'bugfix/*'
  pull_request:
    branches:
      - main
      - devel
      - stage

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

  lint:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Restore node_modules
        uses: actions/cache@v3
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run prettier

  test:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Restore node_modules
        uses: actions/cache@v3
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

      - name: Run tests
        env:
          CI: true
        run: npm run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Restore node_modules
        uses: actions/cache@v3
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

      - name: Build project
        run: npm run build

    publish-image:
      needs: [build]
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-region: us-east-1
            role-to-assume: <oidc-role-arn>
        - uses: aws-actions/amazon-ecr-login@v2
        - run: docker build -t $ECR_REPO:$GITHUB_SHA codebase/rdicidr-0.1.0
        - run: docker push $ECR_REPO:$GITHUB_SHA

defaults:
  run:
    working-directory: codebase/rdicidr-0.1.0
